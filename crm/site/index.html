<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KwOrKs CRM — Enterprise Customer Relationship & Sales Platform</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        background-color: #31122B;
        color: #FFFFFF;
        min-height: 100vh;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* Custom luxury scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #250B20;
      }
      ::-webkit-scrollbar-thumb {
        background: #D7AB6A;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #E5C38E;
      }
      input, select, textarea, button {
        font-family: inherit;
      }

      /* 3D Animations & Keyframes */
      @keyframes float3D {
        0%, 100% {
          transform: translateY(0px) rotate(0deg) scale(1);
        }
        50% {
          transform: translateY(-6px) rotate(4deg) scale(1.08);
        }
      }

      @keyframes goldShimmerSweep {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      @keyframes goldPulseGlow {
        0%, 100% {
          filter: drop-shadow(0 2px 8px rgba(215, 171, 106, 0.4));
        }
        50% {
          filter: drop-shadow(0 4px 18px rgba(255, 215, 0, 0.8));
        }
      }

      @keyframes cardAmbientPulse {
        0%, 100% {
          box-shadow: 0 8px 24px -4px rgba(0,0,0,0.5), 0 0 15px rgba(215, 171, 106, 0.15);
        }
        50% {
          box-shadow: 0 12px 30px -4px rgba(0,0,0,0.6), 0 0 25px rgba(215, 171, 106, 0.35);
        }
      }

      .stat-card-gold-val {
        background: linear-gradient(135deg, #FFF6E5 0%, #F5D79E 25%, #D7AB6A 50%, #FFD700 75%, #B8863A 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: goldShimmerSweep 5s linear infinite;
        text-shadow: 0 2px 16px rgba(215, 171, 106, 0.35);
        display: inline-block;
      }

      .floating-3d-icon {
        animation: float3D 3.5s ease-in-out infinite;
        display: inline-block;
        transform-origin: center;
      }

      /* Clean Print Rules for Proforma / Quotation PDF */
      @media print {
        body {
          background-color: #FFFFFF !important;
          color: #000000 !important;
        }
        header, nav, .no-print, button, .modal-backdrop {
          display: none !important;
        }
        #root {
          display: block !important;
          min-height: auto !important;
        }
        main {
          padding: 0 !important;
        }
        #invoice-document-root {
          border: 1px solid #000 !important;
          box-shadow: none !important;
          margin: 0 !important;
          padding: 20px !important;
          max-width: 100% !important;
          width: 100% !important;
          page-break-after: avoid !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
